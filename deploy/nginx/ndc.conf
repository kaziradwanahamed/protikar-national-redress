# Bangladesh National Data Center (NDC) Hardened Nginx Reverse Proxy
limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=surge_ingest:20m rate=100r/s;

upstream django_http {
    server web-gunicorn:8000;
    keepalive 32;
}

upstream django_ws {
    server web-daphne:8001;
}

server {
    listen 80;
    server_name _;
    location /healthz/ {
        proxy_pass http://django_http;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name grievance.gov.bd _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # NDC Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;

    client_max_body_size 25M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Restrict Prometheus /metrics strictly to internal VPC / Prometheus scraper
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://django_http;
    }

    # Django Channels WebSockets (Live H3 Disaster Map & Case Timelines) -> Daphne
    location /ws/ {
        proxy_pass http://django_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Strict rate limiting on OTP & SSO endpoints
    location ~ ^/api/v1/(accounts/otp|accounts/sso|organogram/sso)/ {
        limit_req zone=auth_strict burst=5 nodelay;
        proxy_pass http://django_http;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # High-burst disaster surge ingest lane
    location /api/v1/disaster/surge/ {
        limit_req zone=surge_ingest burst=200 nodelay;
        proxy_pass http://django_http;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://django_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
