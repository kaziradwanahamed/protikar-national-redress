name: bd-grievance-ndc-prod

x-ndc-django-env: &ndc-django-env
  env_file:
    - ../.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    MINIO_ENDPOINT_URL: http://minio:9000
    VAULT_ADDR: http://vault:8200
    AI_SERVICE_URL: http://ai-service:8001
    GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-""}
    VAULT_MODE: hashicorp

services:
  # ---------------------------------------------------------------------------
  # Edge Reverse Proxy: Nginx (SSL/TLS, Rate Limiting, Security Headers, WS Split)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ndc.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web-gunicorn
      - web-daphne
    networks:
      - edge
      - backend

  # ---------------------------------------------------------------------------
  # HTTP WSGI Application Workers (Gunicorn)
  # ---------------------------------------------------------------------------
  web-gunicorn:
    build:
      context: ..
      dockerfile: Dockerfile
    <<: *ndc-django-env
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 4
             --threads 4
             --worker-class gthread
             --max-requests 1000
             --max-requests-jitter 100
             --timeout 60"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # ASGI WebSocket Workers (Daphne for Live H3 Disaster Command & Case Timelines)
  # ---------------------------------------------------------------------------
  web-daphne:
    build:
      context: ..
      dockerfile: Dockerfile
    <<: *ndc-django-env
    restart: always
    command: daphne -b 0.0.0.0 -p 8001 --proxy-headers config.asgi:application
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Core Data & Streaming Services (PostGIS 16, Redis 7, Kafka 3.8, MinIO, Vault)
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bd_grievance}
      POSTGRES_USER: ${POSTGRES_USER:-grievance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grievance_app} -d ${POSTGRES_DB:-bd_grievance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: always
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  kafka:
    image: apache/kafka:3.8.0
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    networks:
      - backend

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?MINIO_KMS_SECRET_KEY required}
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    volumes:
      - minio_prod_data:/data
    networks:
      - backend

  vault:
    image: hashicorp/vault:1.17
    restart: always
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/vault-config.hcl
    volumes:
      - ./vault/vault-config.hcl:/vault/config/vault-config.hcl:ro
      - vault_prod_data:/vault/file
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Async Workers & Statutory Schedulers (Celery Worker + Celery Beat)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    <<: *ndc-django-env
    restart: always
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=8
      --queues=default,ai_triage,esb,workflow
      --max-tasks-per-child=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  celery-beat:
    build:
      context: ..
      dockerfile: Dockerfile
    <<: *ndc-django-env
    restart: always
    command: >
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # NDC Observability Stack (Prometheus + Grafana)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.2.2
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-ndc_admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme_grafana_pass}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend


  # ---------------------------------------------------------------------------
  # FastAPI AI Cognitive Triage Microservice (ASR, VLM+OCR, Classifier, Geo-NER)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ../ai_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASR_BACKEND: ${ASR_BACKEND:-mock}
      VISION_BACKEND: ${VISION_BACKEND:-mock}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  static_volume:
  postgres_prod_data:
  redis_prod_data:
  kafka_prod_data:
  minio_prod_data:
  vault_prod_data:
  prometheus_data:
  grafana_data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: false
