name: bd-grievance-platform

x-django-env: &django-env
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    DEMO_MODE: ${DEMO_MODE:-True}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    MINIO_ENDPOINT_URL: http://minio:9000
    VAULT_ADDR: http://vault:8200
    AI_SERVICE_URL: http://ai-service:8001
    GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-""}

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 + PostGIS 3.4 (National GIS & Transactional Store)
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bd_grievance}
      POSTGRES_USER: ${POSTGRES_USER:-grievance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grievance_app} -d ${POSTGRES_DB:-bd_grievance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # 2. Redis 7 (Cache, Django Channels Layer, Celery Broker)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme_redis_pass}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # 3. Apache Kafka 3.8 (KRaft Mode - No ZooKeeper) for National ESB & AI Events
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # 4. MinIO (Public Unauthenticated Chainguard Image + SSE-S3 Auto-Encryption)
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio_pass}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-my-minio-key:OSMM567890123456789012345678901234567890123=}
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - backend

  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio_pass}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-grievance-media-encrypted}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        sleep 2;
      done &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_MEDIA &&
      mc encrypt set sse-s3 local/$$MINIO_BUCKET_MEDIA &&
      mc anonymous set none local/$$MINIO_BUCKET_MEDIA &&
      exit 0
      "
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # 4b. HashiCorp Vault (Envelope Encryption Transit Engine for Whistleblowers)
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-vault-token-change-in-prod}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # 5. Django 5+ ASGI Web Application (Daphne + Channels + HTMX + DRF)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *django-env
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 --proxy-headers config.asgi:application"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - backend
      - edge

  # ---------------------------------------------------------------------------
  # 6. Celery Worker (AI Triage, ESB Dispatch, SLA Escalations, Media Processing)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *django-env
    restart: unless-stopped
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=4
      --queues=default,ai_triage,esb,workflow
      --max-tasks-per-child=500
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # 7. Celery Beat (Periodic SLA Watchdogs, RPA Bridge, Doptor Sync)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *django-env
    restart: unless-stopped
    command: >
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - backend


  # ---------------------------------------------------------------------------
  # FastAPI AI Cognitive Triage Microservice (ASR, VLM+OCR, Classifier, Geo-NER)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASR_BACKEND: ${ASR_BACKEND:-mock}
      VISION_BACKEND: ${VISION_BACKEND:-mock}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
